name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: new_deeplinks
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: new_deeplinks
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          dart pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: new_deeplinks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: new_deeplinks/example
        run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: new_deeplinks
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: new_deeplinks/example
        run: flutter build ios --simulator --debug
